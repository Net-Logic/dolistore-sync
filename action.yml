name: DoliStore sync
description: Update a DoliStore product from the dolistore/ folder of a module and a release zip
inputs:
  module-path:
    description: Module repository path
    default: '.'
  descriptor:
    description: Module descriptor path inside the module (for the version)
    required: true
  zip:
    description: Package zip to upload
    required: true
  dry-run:
    description: "Submits only when exactly 'false'; any other value fills the form and stops"
    default: 'true'
  login:
    description: DoliStore login
    required: true
  password:
    description: DoliStore password
    required: true
# Pin this action to a tag or a commit SHA before the rollout to other modules (do not use @main)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install the tool
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Run
      shell: bash
      env:
        DOLISTORE_LOGIN: ${{ inputs.login }}
        DOLISTORE_PASSWORD: ${{ inputs.password }}
        IN_MODULE: ${{ inputs.module-path }}
        IN_DESCRIPTOR: ${{ inputs.descriptor }}
        IN_ZIP: ${{ inputs.zip }}
        IN_DRYRUN: ${{ inputs.dry-run }}
        IN_OUT: ${{ runner.temp }}/dolistore-out
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Fail closed: a real submission only when the input is exactly "false"
        ARGS=()
        if [ "$IN_DRYRUN" = "false" ]; then ARGS+=(--submit); fi
        node "$ACTION_PATH/bin/dolistore-sync.mjs" \
          --module "$IN_MODULE" \
          --descriptor "$IN_DESCRIPTOR" \
          --zip "$IN_ZIP" \
          --out "$IN_OUT" "${ARGS[@]}"
    - name: Keep the form screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dolistore-form
        path: ${{ runner.temp }}/dolistore-out
        if-no-files-found: ignore
        retention-days: 7
