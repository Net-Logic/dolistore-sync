name: DoliStore sync
description: Update a DoliStore product from the dolistore/ folder of a module and a release zip
inputs:
  module-path:
    description: Module repository path
    default: '.'
  descriptor:
    description: Module descriptor path inside the module (for the version)
    required: true
  zip:
    description: Package zip to upload
    required: true
  dry-run:
    description: "Submits only when exactly 'false'; any other value fills the form and stops"
    default: 'true'
  create:
    description: "Create a NEW product (product.yml without id, with a create block) instead of updating one. Only for a manual run"
    default: 'false'
  login:
    description: DoliStore login
    required: true
  password:
    description: DoliStore password
    required: true
# Pin this action to a tag or a commit SHA before the rollout to other modules (do not use @main)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    # hashFiles() only sees the workspace, not the action folder: hash the lockfile by hand
    - name: Cache keys
      id: keys
      shell: bash
      working-directory: ${{ github.action_path }}
      run: echo "lock=$(sha256sum package-lock.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: dolistore-sync-npm-${{ runner.os }}-${{ steps.keys.outputs.lock }}
    - name: Install the dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    # The Chromium build depends on the Playwright version, which the lockfile pins
    - uses: actions/cache@v4
      id: browser
      with:
        path: ~/.cache/ms-playwright
        key: dolistore-sync-chromium-${{ runner.os }}-${{ steps.keys.outputs.lock }}
    # No --with-deps: it downloads fonts and system packages (several minutes on a slow mirror)
    # that a headless form fill does not need; the GitHub runner already has the libraries Chromium links against
    - name: Install Chromium
      if: steps.browser.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx playwright install chromium
    - name: Run
      shell: bash
      env:
        DOLISTORE_LOGIN: ${{ inputs.login }}
        DOLISTORE_PASSWORD: ${{ inputs.password }}
        IN_MODULE: ${{ inputs.module-path }}
        IN_DESCRIPTOR: ${{ inputs.descriptor }}
        IN_ZIP: ${{ inputs.zip }}
        IN_DRYRUN: ${{ inputs.dry-run }}
        IN_CREATE: ${{ inputs.create }}
        IN_OUT: ${{ runner.temp }}/dolistore-out
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Fail closed: a real submission only when the input is exactly "false"
        ARGS=()
        if [ "$IN_DRYRUN" = "false" ]; then ARGS+=(--submit); fi
        if [ "$IN_CREATE" = "true" ]; then ARGS+=(--create); fi
        node "$ACTION_PATH/bin/dolistore-sync.mjs" \
          --module "$IN_MODULE" \
          --descriptor "$IN_DESCRIPTOR" \
          --zip "$IN_ZIP" \
          --out "$IN_OUT" "${ARGS[@]}"
    - name: Keep the form screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dolistore-form
        path: ${{ runner.temp }}/dolistore-out
        if-no-files-found: ignore
        retention-days: 7
